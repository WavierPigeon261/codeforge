name: opencode-self-heal

on:
  # Auto-trigger when any workflow fails
  workflow_run:
    workflows: ["CI Build", "Deploy"]   # ← list your actual workflow names
    types: [completed]
    branches: [main]

  # Manual trigger from Actions tab (your "interactive" button)
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should OpenCode do?"
        required: true
        default: "Analyze the latest failed workflow run, identify the root cause, fix the code, and create a PR."

jobs:
  opencode:
    # Only run on failure (for workflow_run) or always (for manual)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/qwen/qwen3-coder-30b-a3b-instruct
          prompt: |
            You are a self-healing CI agent. Do the following:
            1. Read the failed workflow logs and identify the exact error.
            2. Read the relevant source files to understand the root cause.
            3. Fix the code (do NOT skip tests or disable checks).
            4. Verify the fix compiles/builds locally.
            5. Create a branch `fix/ci-<short-desc>` and commit the fix.
            6. Open a PR labeled `automated` and `ci-fix` with a clear explanation.
            If the failure is transient (network, rate-limit, flaky infra), just comment explaining why no fix is needed.   
