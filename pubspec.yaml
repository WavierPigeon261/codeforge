name: codeforge
description: "An open-source, mobile-first IDE app for Android built with Flutter and Material You."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Material You
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.0
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # Terminal Emulator & Viewport
  xterm: ^4.0.0

  # File System & Utilities
  path_provider: ^2.1.2
  path: ^1.9.0
  file_picker: ^8.0.0
  intl: ^0.19.0

  # Code Editor & Syntax Highlighting
  code_text_field: ^1.1.0
  flutter_highlight: ^0.7.0

  # Network & AI APIs
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

dependency_overrides:
  dynamic_color: 1.8.0
  
